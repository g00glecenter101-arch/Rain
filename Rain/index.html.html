<html lang="en">

            align-items: center;
            justify-content: center;

            color: var(--text-main);

            font-weight: 600;

            width: 100%;
            margin: 0 auto;
            overflow-y: auto;

            font-weight: 500;
            color: var(--text-main);
            gap: 6px;

            height: 12px;

            display: inline-block;

            border: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 20px;
            word-break: break-all;
            line-height: 1.4;
        }

            margin: 40px 0;

            font-weight: 400;
            color: var(--text-main);
            margin-bottom: 8px;

            color: var(--text-dim);

            margin-top: auto;
            margin-bottom: 20px;

            width: 100%;
            margin-left: auto;
            margin-right: auto;

            width: 100%;
            margin: 0 auto;

            font-weight: 600;

    </style>
